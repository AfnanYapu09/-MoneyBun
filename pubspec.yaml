name: moneybun
description: "MoneyBun — แอปจดรายรับรายจ่ายด้วยสลิป/QR ของไทย (Thai income/expense tracker)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.0

  # Local-first database (source of truth)
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Navigation
  go_router: ^14.0.0

  # Slip reading (fully on-device): QR + ML Kit Latin OCR read the amount only.
  mobile_scanner: ^7.0.0
  google_mlkit_text_recognition: ^0.15.0 # Latin OCR: amounts, dates, refs
  photo_manager: ^3.0.0 # Android: read slips straight from a gallery album
  image_picker: ^1.1.2 # pick a profile photo from the gallery

  # Firebase (sync + auth). Real config supplied by `flutterfire configure`.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  google_sign_in: ^7.0.0

  # Utilities
  connectivity_plus: ^6.0.0
  android_id: ^0.4.0 # ANDROID_ID (hashed) for the referral per-device lock
  url_launcher: ^6.3.0 # open LINE / email links from Help
  uuid: ^4.4.0
  intl: any
  google_fonts: ^6.2.0
  collection: ^1.18.0
  lucide_icons_flutter: ^3.1.14+2
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  excel: ^4.0.6
  share_plus: ^13.2.0
  package_info_plus: ^10.2.0 # reads the real version/build shown in Settings

  # Daily "จดบันทึก" reminder notification (scheduled locally, no server).
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.20.0
  # Used by avatar_restore_test.dart to fake the documents directory.
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
  generate: true
  # The "Bun" mascot and category icons are rendered programmatically
  # (CustomPainter + Material icons) so no binary assets are required yet.
  # Drop final pixel-art PNGs into assets/images/bun/ and declare them here later.
  assets:
    - google_fonts/
    - assets/banks/

  # The wordmark uses the Fraunces VARIABLE font (the file the logo was
  # designed with) so the optical-size axis can be pushed to its display
  # maximum via FontVariation — the static cuts can't reach that contrast.
  fonts:
    - family: FrauncesVar
      fonts:
        - asset: google_fonts/FrauncesVariable.ttf
